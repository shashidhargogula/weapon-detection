<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weapon Detection</title>
    <style>
        body {
    font-family: 'Arial', sans-serif;
    background-image: url('../static/w2.jpg'); /* Add the path to your image here */
    background-size: cover; /* Ensures the image covers the whole page */
    background-position: center; /* Centers the image */
    color: white;
    text-align: center;
    margin: 0;
    padding: 0;
    height: 100vh; /* Ensures the body takes full height of the screen */
}

        h1 {
            margin-top: 30px;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            margin-top: 50px;
        }

        .upload-section, .live-camera-section {
            background-color: #1e1e1e;
            padding: 20px;
            margin: 20px auto;
            width: 50%;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 87, 34, 0.8);
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            background-color: #ff5722;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .custom-file-upload:hover {
            background-color: #e64a19;
        }

        button {
            display: inline-block;
            background-color: #ff5722;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e64a19;
        }

        .or-section {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            color: #ff9800;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Weapon Detection System</h1>
    
    <div class="container">
        <div class="upload-section">
            <div class="icon">📁</div>
            <h2>Upload a Video for Detection</h2>
            <form action="/index" method="post" enctype="multipart/form-data">
                <label for="file-upload" class="custom-file-upload">Choose a Video</label>
                <input id="file-upload" type="file" name="file" accept="video/*" required>
                <br>
                <button type="submit">Upload & Start Detection</button>
            </form>
        </div>

        <div class="or-section">OR</div>

        <div class="live-camera-section">
            <div class="icon">📷</div>
            <h2>Live Camera Detection</h2>
            <a href="/open_camera"><button>Open Camera</button></a>
        </div>
        <a href="/charts"><button style="background:black;">charts</button></a>
    </div>
</body>
</html>
