<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 20px;
            font-size: 28px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        #video-stream {
            width: 70%;
            max-width: 800px;
            border: 5px solid #ff5722;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(255, 87, 34, 0.8);
        }

        .loader {
            display: none;
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ff5722;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #ff5722;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>
    <h1>Live Camera Weapon Detection</h1>
    
    <div class="container">
        <div class="loader" id="loading"></div>
        <img id="video-stream" src="{{ url_for('camera_feed') }}" onload="hideLoader()">
    </div>
    
    <br>
    <a href="/" class="btn">Back to Home</a>

    <script>
        function hideLoader() {
            document.getElementById("loading").style.display = "none";
        }

        window.onload = function () {
            document.getElementById("loading").style.display = "block";
        };
    </script>
</body>
</html>
