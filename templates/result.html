<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Detection</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            transition: background 0.5s ease-in-out;
        }

        h1 {
            margin-top: 20px;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            margin-top: 30px;
        }

        img {
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 87, 34, 0.8);
            transition: 0.3s;
        }

        .alert {
            animation: alertFlash 1s infinite alternate;
        }

        @keyframes alertFlash {
            0% { background-color: red; }
            100% { background-color: black; }
        }

        .back-button {
            display: inline-block;
            background-color: #ff5722;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            text-decoration: none;
        }

        .back-button:hover {
            background-color: #e64a19;
        }
    </style>
    <script>
        function checkWeaponDetection() {
            fetch('/check_alert')
                .then(response => response.json())
                .then(data => {
                    if (data.alert) {
                        document.body.classList.add('alert');
                    } else {
                        document.body.classList.remove('alert');
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        setInterval(checkWeaponDetection, 1000); // Check every second
    </script>
</head>
<body>
    <h1>Live Weapon Detection</h1>
    
    <div class="container">
        <img src="{{ url_for('video_feed', filename=filename) }}" width="70%">
    </div>

    <br>
    <a href="/" class="back-button">Upload Another Video</a>
</body>
</html>
